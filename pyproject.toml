[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insider-threat-ueba"
version = "0.1.0"
description = "Leakage-safe user and entity behavior analytics on CERT r4.2"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[theme]
base = "light"
primaryColor = "#111111"
backgroundColor = "#ebebeb"
secondaryBackgroundColor = "#f4f4f4"
textColor = "#111111"
font = "sans serif"
baseRadius = "0.8rem"
buttonRadius = "999px"
borderColor = "#e3e3e3"
showWidgetBorder = true

[server]
headless = true

[client]
toolbarMode = "minimal"
